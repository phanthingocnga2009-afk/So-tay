<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Tay">
<meta name="theme-color" content="#fffaf2">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Sổ Tay Mục Tiêu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
/* Layout: one-column phone app, scrolling content + fixed bottom tab bar; pastel Y2K sticker look (single light theme by choice) */
:root{
  --blue:#4aa8ff;--blue2:#cfe8ff;--pink:#ff6fae;--pink2:#ffd6e8;--lav:#a78bfa;--lav2:#ece5ff;
  --yel:#ffd43b;--yel2:#fff3bf;--org:#f59f00;--ink:#1f2a5c;--soft:#5a6799;--mute:#9aa6cc;
  --card:#ffffff;--cream:#fffaf2;--line:#dbe6ff;--bg1:#bfe0ff;--bg2:#ffd1e6;--bg3:#e6dcff;--danger:#e8455f;
  --display:"Baloo 2","Quicksand",system-ui,sans-serif;--body:"Quicksand",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
svg.i{width:1em;height:1em;vertical-align:-.15em;flex:0 0 auto}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--cream);position:relative;box-shadow:0 0 40px #4a6fd633}
.scr{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));position:relative;overflow:hidden}
.view{display:flex;flex-direction:column;gap:14px}
.float{position:absolute;animation:fl 3s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(12deg)}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
@keyframes bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.tw{animation:tw 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hello{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
.date{color:var(--soft);font-size:13px;font-weight:700}
.badge{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--yel),var(--pink));display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff;box-shadow:0 4px 10px #ff6fae55;flex:0 0 auto}

.core{border-radius:22px;padding:14px 16px;background:linear-gradient(120deg,var(--blue),var(--lav) 55%,var(--pink));color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 18px #a78bfa55;text-align:left;width:100%}
.core small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.core p{font-family:var(--display);font-size:19px;font-weight:800;line-height:1.25;margin:2px 0 0;max-width:86%;text-wrap:balance}
.core .s1{right:14px;top:10px;font-size:22px;color:var(--yel)}
.core .s2{right:42px;bottom:10px;font-size:14px;color:#fff}

.row{display:flex;gap:12px;align-items:flex-start}
.photo{flex:0 0 128px;background:#fff;border-radius:16px;padding:7px 7px 6px;box-shadow:0 6px 16px #4a6fd640;animation:bob 4s ease-in-out infinite;position:relative;margin-top:6px}
.photo .tape{position:absolute;top:-8px;left:42px;width:44px;height:16px;background:#ffd43bcc;border-radius:3px;transform:rotate(-6deg);z-index:1}
.pic{height:140px;border-radius:11px;background:linear-gradient(135deg,var(--pink2),var(--blue2));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:24px;color:var(--pink);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic span{font-size:11px;font-weight:700;color:var(--soft);text-align:center;padding:0 6px}
.cap{font-size:11px;text-align:center;margin-top:4px;font-weight:700;color:var(--pink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.box{background:var(--card);border-radius:18px;padding:12px;border:2px solid var(--line)}
.short{flex:1;min-width:0;border-color:var(--blue2)}
.lab{font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin:0}
.g{margin-top:9px;font-size:13px;font-weight:700;display:block;width:100%;text-align:left}
.g .nm{display:flex;gap:5px;align-items:center;min-width:0}
.g .nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:9px;background:var(--blue2);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .4s}
.empty{font-size:13px;color:var(--soft);font-weight:600;margin-top:8px}
.link{color:var(--pink);font-weight:800;font-size:13px}

.sec{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec .cnt{color:var(--pink);font-weight:800;font-size:13px;display:flex;gap:4px;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:9px 10px 9px 12px}
.task .body{flex:1;min-width:0;text-align:left}
.task p{font-size:14px;font-weight:700;margin:0;overflow-wrap:anywhere}
.task .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.task.d p{text-decoration:line-through;color:#a7b0cc}
.ico{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--blue);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}
.ck.done{background:var(--pink);border-color:var(--pink);animation:pop .3s}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--pink2);color:#c42a72;display:inline-flex;gap:3px;align-items:center}
.tag.b{background:var(--blue2);color:#1a64b3}
.tag.l{background:var(--lav2);color:#5b37c9}
.tag.y{background:var(--yel2);color:#a35f00}
.add{display:flex;justify-content:center;gap:6px;align-items:center;width:100%;background:linear-gradient(90deg,var(--blue),var(--pink));color:#fff;border-radius:16px;padding:12px;font-weight:800;font-size:14px;box-shadow:0 6px 14px #ff6fae44}
.add.ghost{background:#fff;color:var(--soft);border:2px dashed var(--blue);box-shadow:none;padding:9px}

.tabs{display:flex;background:var(--blue2);border-radius:14px;padding:3px}
.tabs button{flex:1;text-align:center;font-size:13px;font-weight:800;padding:8px;border-radius:11px;color:var(--soft)}
.tabs .on{background:#fff;color:var(--pink)}
.mh{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.mh button{width:32px;height:32px;border-radius:50%;background:var(--blue2);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.grid .w{font-size:10px;font-weight:800;color:var(--lav);padding:2px 0}
.grid .d{font-size:14px;font-weight:700;padding:8px 0;border-radius:12px;position:relative;font-variant-numeric:tabular-nums}
.grid .d.dot::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pink)}
.grid .d.dot.ok::after{background:var(--blue)}
.grid .d.today{color:var(--pink);font-weight:800}
.grid .d.sel{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;box-shadow:0 4px 10px #ff6fae55}
.grid .d.sel::after{background:#fff}
.week{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;width:100%}
.wk.sel{background:var(--pink2)}
.wk b{font-family:var(--display);font-size:20px;width:30px;text-align:center;font-variant-numeric:tabular-nums}
.wk span{flex:1;font-size:13px;font-weight:700;color:var(--soft)}

.gl{display:flex;flex-direction:column;gap:6px}
.gt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:15px}
.gt .nm{display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere;text-align:left}
.lvl{font-size:10px;font-weight:800;color:#fff;border-radius:8px;padding:2px 7px;white-space:nowrap}
.pct{font-size:12px;font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
.iconbtn{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--soft);background:var(--lav2);font-size:15px;flex:0 0 auto}
.child{margin:6px 0 0 10px;border-left:2.5px dashed var(--pink);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.child .gt{font-size:14px}
.leaf{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);font-weight:700;text-align:left;width:100%;padding:3px 0}
.leaf .days{margin-left:auto;font-size:10px;color:var(--lav);white-space:nowrap}
.mini{font-size:12px;font-weight:800;color:var(--pink);text-align:left;padding:4px 0}
.trophy{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#fff3bf,#ffe3ef);border-radius:16px;padding:12px;font-weight:800;font-size:14px;width:100%;text-align:left}
.done-list{display:flex;flex-direction:column;gap:6px}
.done-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:#fff;border-radius:12px;padding:8px 10px}
.done-item span{flex:1;min-width:0;overflow-wrap:anywhere}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;width:100%;max-width:480px;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.nav button{font-size:11px;font-weight:800;color:var(--mute);text-align:center;padding:4px 10px;border-radius:12px}
.nav button svg{display:block;margin:0 auto 2px;width:25px;height:25px}
.nav button.on{color:var(--pink)}

.ov{position:fixed;inset:0;background:#1f2a5c66;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--cream);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sheet h3{font-family:var(--display);font-size:21px;margin:0;display:flex;gap:6px;align-items:center}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.l{font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;font-size:16px;font-weight:600}
textarea.inp{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;display:inline-flex;gap:5px;align-items:center}
.chip.on{border-color:var(--pink);background:var(--pink2);color:#c42a72}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icons button{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid transparent}
.icons button.on{border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--pink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border-radius:14px;padding:12px;font-weight:800;font-size:15px;background:linear-gradient(90deg,var(--blue),var(--pink));color:#fff;text-align:center}
.btn.sec2{background:var(--blue2);color:var(--ink)}
.btn.del{background:#ffe1e6;color:var(--danger)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 12px;font-size:13px}
.confirm{background:#ffe1e6;border-radius:14px;padding:12px;font-size:14px;font-weight:700;color:var(--danger);display:flex;flex-direction:column;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:12px;overflow:hidden;border:3px solid transparent;background:var(--blue2)}
.th.on{border-color:var(--pink)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--danger);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.upl{aspect-ratio:3/4;max-width:100%;border-radius:12px;border:2px dashed var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--pink);font-size:12px;font-weight:800;position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.sw input{width:22px;height:22px;accent-color:var(--pink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:14px;z-index:60;max-width:90%;text-align:center}
.welcome{text-align:center;display:flex;flex-direction:column;gap:14px;padding-top:30px}
.welcome .big{font-size:56px;color:var(--pink);animation:bob 3s ease-in-out infinite}
.welcome p{color:var(--soft);font-weight:600;margin:0;line-height:1.5}
.set-row{display:flex;flex-direction:column;gap:8px}
.help{font-size:14px;line-height:1.6;color:var(--soft);font-weight:600;margin:0}
.help b{color:var(--ink)}
.warn{display:flex;gap:8px;align-items:flex-start;background:#fff3bf;color:#7a4b00;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.45;text-align:left}
.sync.bad{color:var(--danger)}
.sync{font-size:11px;font-weight:700;color:var(--mute);text-align:center}
</style>

</head><body>

<symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="currentColor"/><path fill="#fff" d="M12 7.2c-.8-1-2.8-.7-2.6.9.2 1.4 2.6 3 2.6 3s2.4-1.6 2.6-3c.2-1.6-1.8-1.9-2.6-.9zM8 14h8v1.8H8z"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path fill="currentColor" d="M8 7V6a4 4 0 018 0v1h3.5l-1 14h-13l-1-14zm2 0h4V6a2 2 0 00-4 0z"/></symbol>
<symbol id="note" viewBox="0 0 24 24"><path fill="currentColor" d="M9 18.5a3 3 0 11-2-2.8V5l12-2.5v12.8a3 3 0 11-2-2.8V6.7L9 8.3z"/></symbol>
<symbol id="cup" viewBox="0 0 24 24"><path fill="currentColor" d="M4 8h13v5a6 6 0 01-6 6h-1a6 6 0 01-6-6zm13 1.5h1.5a2.5 2.5 0 010 5H17v-2h1.5a.5.5 0 000-1H17zM8 2.5c1 1-1 2 0 3.5M12 2.5c1 1-1 2 0 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="3" y="20" width="16" height="2" rx="1" fill="currentColor"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9.5 8.2-1.3 1.5L19 11.7V21h-5v-6h-4v6H5v-9.3l-1.2 1L2.5 11.2z"/></symbol>
<symbol id="trophy" viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v2h3v3a4 4 0 01-4 4h-.3A5 5 0 0113 14.9V18h3v3H8v-3h3v-3.1A5 5 0 018.3 12H8a4 4 0 01-4-4V5h3zm0 4H6v1a2 2 0 001 1.7zm10 0v2.7A2 2 0 0018 8V7z"/></symbol>
<symbol id="repeat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M17 2l3 3-3 3M4 11V9a4 4 0 014-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 01-4 4H4"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
</defs></svg>

<div class="app">
  <main class="scr" id="scr"></main>
  <nav class="nav" aria-label="Chuyển màn hình"><div class="in" id="nav"></div></nav>
</div>
<div id="layer"></div>

<script>
(()=>{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=(n,st="")=>`<svg class="i" ${st?`style="${st}"`:""}><use href="#${n}"/></svg>`;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkeyOf=k=>"m-"+k.slice(0,7);
const parse=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dkey(new Date());
const WD=["CN","T2","T3","T4","T5","T6","T7"];
const WDL=["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
const clone=o=>JSON.parse(JSON.stringify(o));

const ICONS={heart:["#ffd6e8","#ff6fae"],star:["#fff3bf","#f59f00"],coin:["#fff3bf","#f59f00"],run:["#cfe8ff","#4aa8ff"],book:["#ece5ff","#a78bfa"],bag:["#ffd6e8","#ff6fae"],note:["#ece5ff","#a78bfa"],cup:["#ffe8d6","#e8803a"],home:["#cfe8ff","#4aa8ff"],flower:["#ffd6e8","#ff7eb6"],fly:["#ece5ff","#8b6cf0"],sun:["#fff3bf","#f5a300"],moon:["#e0e6ff","#5a6799"],cam:["#cfe8ff","#2f8be0"]};
const ICON_KEYS=Object.keys(ICONS);
const icoBox=n=>{const c=ICONS[n]||ICONS.heart;return `<div class="ico" style="background:${c[0]};color:${c[1]}">${ic(n in ICONS?n:"heart")}</div>`};
const icoInline=n=>{const c=ICONS[n]||ICONS.heart;return ic(n in ICONS?n:"heart",`color:${c[1]}`)};
const LONG_COL=["#a78bfa","#ff6fae","#4aa8ff","#f59f00","#3aa76d"];
const TAGC=["l","","b","y"];

/* ---------- state ---------- */
let S={main:null,months:{}};
const ui={tab:"today",calMode:"month",calSel:todayKey(),calMonth:todayKey().slice(0,7),showDone:false,ready:false};
let db=null,assets=null,mode="device",saveState="ok",savedAt="";
const standalone=!!(navigator.standalone||window.matchMedia("(display-mode: standalone)").matches);

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
const cached=lsGet("stmt-cache");
if(cached&&cached.main){S=cached;S.months=S.months||{}}
ui.ready=true;
function month(mk){return S.months[mk]||(S.months[mk]={tasks:{},rd:{}})}

/* ---------- persistence: everything stays on this phone ---------- */
function save(){
  if(lsSet("stmt-cache",S)){saveState="ok";const d=new Date();savedAt=pad(d.getHours())+":"+pad(d.getMinutes())}
  else{saveState="err";toast("Bộ nhớ của app đã đầy. Hãy xoá bớt ảnh.")}
  const el=document.getElementById("svst");if(el)el.outerHTML=saveLine();
}
function saveLine(){
  if(saveState==="err")return `<p id="svst" class="sync bad">Chưa lưu được, bộ nhớ app đã đầy</p>`;
  const tip=standalone?"":`<div class="warn">${ic("home")} <span><b>Mẹo:</b> thêm app vào màn hình chính (Safari → nút Chia sẻ → Thêm vào MH chính) để iPhone giữ dữ liệu lâu dài.</span></div>`;
  return `<div id="svst" class="view" style="gap:8px">${tip}<p class="sync">Đã lưu trên điện thoại này${savedAt?" lúc "+savedAt:""} ✓</p></div>`;
}
function watch(){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}

/* photos live in IndexedDB (too big for localStorage) */
let idbP=null;
function idb(){return idbP||(idbP=new Promise((res,rej)=>{const r=indexedDB.open("stmt-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("p",mode);const st=tx.objectStore("p");const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})}
const idbGet=id=>idbDo("readonly",st=>st.get(id));
const idbPut=(id,v)=>idbDo("readwrite",st=>st.put(v,id));
const idbDel=id=>idbDo("readwrite",st=>st.delete(id));
async function boot(){render()}

/* ---------- derived ---------- */
const goals=()=>S.main?.goals||[];
const routines=()=>S.main?.routines||[];
const goalById=id=>goals().find(g=>g.id===id);
const longs=(done=false)=>goals().filter(g=>g.level==="long"&&!!g.done===done);
const shortsOf=pid=>goals().filter(g=>g.level==="short"&&g.parent===pid&&!g.done);
function progress(g){
  if(g.done)return 100;
  if(g.level==="long"){const ch=goals().filter(x=>x.level==="short"&&x.parent===g.id);if(ch.length)return Math.round(ch.reduce((a,x)=>a+(x.done?100:(x.progress||0)),0)/ch.length)}
  return g.progress||0;
}
function longIndex(id){const l=goals().filter(g=>g.level==="long");return Math.max(0,l.findIndex(g=>g.id===id))}
function tagFor(goalId){
  const g=goalById(goalId);if(!g)return"";
  const root=g.level==="long"?g.id:g.parent;const c=TAGC[longIndex(root)%TAGC.length];
  return `<span class="tag ${c}">${esc(g.title)}</span>`;
}
function itemsFor(k){
  const wd=parse(k).getDay();const m=month(mkeyOf(k));const rd=m.rd[k]||[];
  const created=k>=(S.main?.since||"0000");
  const r=routines().filter(x=>(x.days||[]).includes(wd)&&(!x.from||k>=x.from)&&created).map(x=>({kind:"r",id:x.id,title:x.title,icon:x.icon,goal:x.goal,time:x.time||"",done:rd.includes(x.id)}));
  const t=(m.tasks[k]||[]).map(x=>({kind:"t",...x}));
  return[...r,...t].sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
}

/* ---------- render ---------- */
function render(){
  const scr=$("#scr");
  renderNav();
  if(!ui.ready){scr.innerHTML=`<div class="welcome"><div class="big">${ic("heart")}</div><p>Đang mở sổ tay…</p></div>`;return}
  if(!S.main){scr.innerHTML=welcome();bindWelcome();return}
  scr.innerHTML=ui.tab==="today"?viewToday():ui.tab==="cal"?viewCal():ui.tab==="goals"?viewGoals():viewSettings();
}
function renderNav(){
  const t=[["today","sun","Hôm nay"],["cal","cal","Lịch"],["goals","star","Mục tiêu"],["set","gear","Cài đặt"]];
  $("#nav").innerHTML=t.map(([k,i,l])=>`<button data-tab="${k}" class="${ui.tab===k?"on":""}" aria-current="${ui.tab===k}">${ic(i)}${l}</button>`).join("");
}

function welcome(){
  return `<div class="welcome">
  <div class="big">${ic("heart")}</div>
  <h1 class="hello">Chào mừng đến Sổ Tay Mục Tiêu</h1>
  <p>Viết ra điều quan trọng nhất bạn đang cố gắng. Mỗi lần mở app, nó sẽ hiện ngay trên cùng để bạn không quên.</p>
  <div class="fld" style="text-align:left"><label for="w-name">Tên của bạn</label><input class="inp" id="w-name" value="Nga" maxlength="30"></div>
  <div class="fld" style="text-align:left"><label for="w-core">Mục tiêu cốt lõi</label><textarea class="inp" id="w-core" placeholder="Ví dụ: Tự chủ tài chính và sống khoẻ mạnh"></textarea></div>
  <button class="btn" data-act="start">Bắt đầu</button>
  <button class="btn sec2" data-act="sample">Dùng mẫu gợi ý (sửa được sau)</button>
  ${saveLine()}
  </div>`;
}
function bindWelcome(){}

function photoToday(){
  const m=S.main,ps=m.photos||[];if(!ps.length)return null;
  const k=todayKey();
  if(m.photo&&m.photo.date===k){const p=ps.find(x=>x.id===m.photo.id);if(p)return p}
  if(m.rotate===false){const p=ps.find(x=>x.id===m.pinned);return p||ps[0]}
  const n=Math.floor(parse(k).getTime()/864e5);return ps[((n%ps.length)+ps.length)%ps.length];
}
const photoCache={},photoFail={},photoLoading={};
function loadPhoto(id){
  if(photoLoading[id])return;photoLoading[id]=true;
  idbGet(id).then(src=>{if(src){photoCache[id]=src;render();if($("#layer .thumbs"))sheetPhotos()}else{photoFail[id]=true;render()}}).catch(()=>{photoFail[id]=true;render()});
}
function purl(p){if(p.src)return p.src;if(photoCache[p.id])return photoCache[p.id];loadPhoto(p.id);return ""}
function photoImg(p,alt){const u=purl(p);return u?`<img src="${esc(u)}" alt="${alt}" data-pid="${esc(p.id)}">`:`<span>${photoFail[p.id]?"Ảnh lỗi, hãy xoá và thêm lại":"Đang tải ảnh…"}</span>`}
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.dataset.pid&&!photoFail[t.dataset.pid]){photoFail[t.dataset.pid]=true;render();if($("#layer .thumbs"))sheetPhotos()}},true);

function viewToday(){
  const m=S.main,k=todayKey(),d=new Date(),items=itemsFor(k);
  const done=items.filter(x=>x.done).length;
  const p=photoToday();
  const shorts=goals().filter(g=>g.level==="short"&&!g.done).slice(0,4);
  const hr=d.getHours();const greet=hr<11?"Chào buổi sáng":hr<14?"Chào buổi trưa":hr<18?"Chào buổi chiều":"Chào buổi tối";
  return `<div class="view">
  ${ic("fly","position:absolute;right:76px;top:12px;font-size:16px;color:#a78bfa").replace('class="i"','class="i float"')}
  <div class="top"><div><div class="date">${WDL[d.getDay()]} · ${d.getDate()} tháng ${d.getMonth()+1}</div><h1 class="hello">${greet}, ${esc(m.name||"bạn")} ${ic("heart","color:#ff6fae")}</h1></div>
  <div class="badge">${ic(hr>=18||hr<5?"moon":"sun")}</div></div>
  <button class="core" data-act="edit-core" aria-label="Sửa mục tiêu cốt lõi">${ic("star").replace('class="i"','class="i float s1"')}${ic("spark").replace('class="i"','class="i tw float s2"')}
  <small>Mục tiêu cốt lõi</small><p>${esc(m.core||"Chạm để viết mục tiêu cốt lõi")}</p></button>
  <div class="row">
    <button class="photo" data-act="photos" aria-label="Đổi ảnh hôm nay"><span class="tape"></span>
      <div class="pic">${p?photoImg(p,"Ảnh hôm nay"):`${ic("cam")}<span>Chạm để thêm ảnh</span>`}</div>
      <div class="cap">${esc(m.caption||"my fave ♡")}</div></button>
    <div class="box short"><p class="lab">Mục tiêu ngắn hạn</p>
      ${shorts.length?shorts.map(g=>`<button class="g" data-act="edit-goal" data-id="${g.id}"><span class="nm">${icoInline(g.icon)}<b>${esc(g.title)}</b></span><div class="bar"><i style="width:${progress(g)}%"></i></div></button>`).join(""):`<p class="empty">Chưa có mục tiêu ngắn hạn.</p><button class="link" data-tab="goals">＋ Thêm ở tab Mục tiêu</button>`}
    </div>
  </div>
  <div class="sec"><p class="lab">Việc hôm nay</p><span class="cnt">${done}/${items.length} ${ic("star")}</span></div>
  <div class="list">${items.length?items.map(x=>taskRow(x,k)).join(""):`<p class="empty">Hôm nay chưa có việc nào. Thêm một việc nhỏ hướng về mục tiêu của bạn nhé.</p>`}</div>
  <button class="add" data-act="add-task" data-date="${k}">＋ Thêm việc</button>
  ${saveLine()}
  </div>`;
}
function taskRow(x,k){
  return `<div class="task ${x.done?"d":""}">
    ${icoBox(x.icon)}
    <button class="body" data-act="${x.kind==="r"?"edit-routine":"edit-task"}" data-id="${x.id}" data-date="${k}"><p>${esc(x.title)}</p>
      <div class="meta">${x.time?`<span class="tag y">${ic("clock")}${esc(x.time)}</span>`:""}${x.kind==="r"?`<span class="tag b">${ic("repeat")}Lặp lại</span>`:""}${tagFor(x.goal)}</div></button>
    <button class="ck ${x.done?"done":""}" data-act="toggle" data-kind="${x.kind}" data-id="${x.id}" data-date="${k}" aria-label="${x.done?"Bỏ đánh dấu xong":"Đánh dấu xong"}">${x.done?"✓":""}</button>
  </div>`;
}

function viewCal(){
  const[y,mo]=ui.calMonth.split("-").map(Number);
  const first=new Date(y,mo-1,1),days=new Date(y,mo,0).getDate();
  const lead=(first.getDay()+6)%7;const tk=todayKey();
  watch("m-"+ui.calMonth);
  let cells="";
  for(let i=0;i<lead;i++)cells+="<div></div>";
  const mm=month("m-"+ui.calMonth);
  for(let d=1;d<=days;d++){
    const k=`${ui.calMonth}-${pad(d)}`;const ts=mm.tasks[k]||[];
    const cls=["d"];if(ts.length)cls.push("dot");if(ts.length&&ts.every(t=>t.done))cls.push("ok");if(k===tk)cls.push("today");if(k===ui.calSel)cls.push("sel");
    cells+=`<button class="${cls.join(" ")}" data-act="pick" data-date="${k}">${d}</button>`;
  }
  const sel=ui.calSel,sd=parse(sel),items=itemsFor(sel);
  let week="";
  if(ui.calMode==="week"){
    const st=new Date(sd);st.setDate(sd.getDate()-((sd.getDay()+6)%7));
    for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=dkey(d);watch(mkeyOf(k));const it=itemsFor(k);const dn=it.filter(x=>x.done).length;
      week+=`<button class="wk ${k===sel?"sel":""}" data-act="pick" data-date="${k}"><b>${d.getDate()}</b><span>${WDL[d.getDay()]}${k===tk?" · hôm nay":""}</span><span style="flex:0 0 auto">${it.length?`${dn}/${it.length} việc`:"trống"}</span></button>`}
  }
  return `<div class="view">
  ${ic("cloud","position:absolute;right:22px;top:10px;font-size:32px;color:#cfe8ff").replace('class="i"','class="i float"')}
  ${ic("spark","position:absolute;right:62px;top:32px;font-size:14px;color:#ffd43b").replace('class="i"','class="i float tw"')}
  <h1 class="hello">Lịch của tôi ${ic("cherry")}</h1>
  <div class="tabs" role="tablist"><button data-act="calmode" data-m="week" class="${ui.calMode==="week"?"on":""}">Tuần</button><button data-act="calmode" data-m="month" class="${ui.calMode==="month"?"on":""}">Tháng</button></div>
  <div class="box">
  ${ui.calMode==="month"?`<div class="mh"><button data-act="mon" data-d="-1" aria-label="Tháng trước">‹</button>Tháng ${mo}, ${y}<button data-act="mon" data-d="1" aria-label="Tháng sau">›</button></div>
  <div class="grid">${["T2","T3","T4","T5","T6","T7","CN"].map(w=>`<div class="w">${w}</div>`).join("")}${cells}</div>`
  :`<div class="mh"><button data-act="wk" data-d="-7" aria-label="Tuần trước">‹</button>Tuần của ${sd.getDate()}/${sd.getMonth()+1}<button data-act="wk" data-d="7" aria-label="Tuần sau">›</button></div><div class="week">${week}</div>`}
  </div>
  <div class="sec"><p class="lab">${WDL[sd.getDay()]} · ${sd.getDate()}/${sd.getMonth()+1}</p><span class="cnt">${items.length} việc</span></div>
  <div class="list">${items.length?items.map(x=>taskRow(x,sel)).join(""):`<p class="empty">Ngày này chưa có việc nào.</p>`}</div>
  <button class="add" data-act="add-task" data-date="${sel}">＋ Thêm việc cho ngày này</button>
  ${sel!==tk?`<button class="add ghost" data-act="pick" data-date="${tk}">Về hôm nay</button>`:""}
  </div>`;
}

function viewGoals(){
  const L=longs(),D=goals().filter(g=>g.done);
  const dayTxt=r=>{const ds=r.days||[];if(ds.length===7)return"mỗi ngày";return[1,2,3,4,5,6,0].filter(d=>ds.includes(d)).map(d=>WD[d]).join(" · ")};
  return `<div class="view">
  ${ic("flower","position:absolute;right:24px;top:10px;font-size:24px;color:#ff9ec8").replace('class="i"','class="i float"')}
  ${ic("fly","position:absolute;right:60px;top:34px;font-size:15px;color:#4aa8ff").replace('class="i"','class="i float"')}
  <h1 class="hello">Mục tiêu ${ic("star","color:#ffd43b").replace('class="i"','class="i tw"')}</h1>
  <button class="core" data-act="edit-core">${ic("star").replace('class="i"','class="i float s1"')}<small>Mục tiêu cốt lõi</small><p>${esc(S.main.core||"Chạm để viết")}</p></button>
  ${L.length?"":`<p class="empty">Chưa có mục tiêu dài hạn. Bắt đầu bằng một điều bạn muốn đạt được trong 1–3 năm tới.</p>`}
  ${L.map((g,gi)=>{const col=LONG_COL[longIndex(g.id)%LONG_COL.length];const sh=shortsOf(g.id);return `<div class="box gl">
    <div class="gt"><span class="nm"><span class="lvl" style="background:${col}">Dài hạn</span>${icoInline(g.icon)}${esc(g.title)}</span><span style="display:flex;gap:6px;align-items:center"><span class="pct">${progress(g)}%</span><button class="iconbtn" data-act="edit-goal" data-id="${g.id}" aria-label="Sửa">${ic("pen")}</button></span></div>
    ${g.period?`<div class="date">${esc(g.period)}</div>`:""}
    <div class="bar"><i style="width:${progress(g)}%"></i></div>
    ${sh.map(s=>{const rs=routines().filter(r=>r.goal===s.id);return `<div class="child">
      <div class="gt"><span class="nm">${icoInline(s.icon)}${esc(s.title)}</span><span style="display:flex;gap:6px;align-items:center"><span class="pct">${progress(s)}%</span><button class="iconbtn" data-act="edit-goal" data-id="${s.id}" aria-label="Sửa">${ic("pen")}</button></span></div>
      ${s.period?`<div class="date">${esc(s.period)}</div>`:""}
      <div class="bar"><i style="width:${progress(s)}%"></i></div>
      ${rs.map(r=>`<button class="leaf" data-act="edit-routine" data-id="${r.id}">↳ ${icoInline(r.icon)} ${esc(r.title)}<span class="days">${dayTxt(r)}</span></button>`).join("")}
      <button class="mini" data-act="add-routine" data-goal="${s.id}">＋ Việc lặp lại hằng ngày</button>
    </div>`}).join("")}
    <button class="mini" data-act="add-goal" data-level="short" data-parent="${g.id}">＋ Mục tiêu ngắn hạn</button>
  </div>`}).join("")}

    if(b.dataset.kind==="r"){const arr=m.rd[k]||(m.rd[k]=[]);const i=arr.indexOf(b.dataset.id);i>=0?arr.splice(i,1):arr.push(b.dataset.id)}
    else{const t=(m.tasks[k]||[]).find(x=>x.id===b.dataset.id);if(t)t.done=!t.done}

    const it=itemsFor(k);if(it.length&&it.every(x=>x.done)&&k===todayKey())toast("Xong hết việc hôm nay rồi! Giỏi quá ♡");return}
  case"add-task":sheetTask(b.dataset.date);return;
  case"edit-task":sheetTask(b.dataset.date,b.dataset.id);return;
  case"edit-routine":sheetRoutine(b.dataset.id);return;
  case"add-routine":sheetRoutine(null,b.dataset.goal);return;

  case"wk":{const d=parse(ui.calSel);d.setDate(d.getDate()+Number(b.dataset.d));ui.calSel=dkey(d);ui.calMonth=ui.calSel.slice(0,7);render();return}
  case"show-done":ui.showDone=!ui.showDone;render();return;
  case"undone":{const g=goalById(b.dataset.id);if(g){g.done=false;if(g.level==="short"&&!goalById(g.parent))g.level="long",g.parent=null;save("main");render();toast("Đã mở lại mục tiêu")}return}
  case"ask-del":$("#cf").hidden=false;return;
  case"no-del":$("#cf").hidden=true;return;
  case"do-del":doDelete();return;
  case"save-task":saveTask();return;

function saveTask(){
  const title=val("f-title");if(!title){toast("Hãy nhập tên việc");return}
  const{date,id}=sheetCtx,nd=val("f-date")||date;
  const body={title,time:val("f-time"),goal:val("f-goal")||null,icon:pickedIcon()};
  let done=false;
  if(id){const m=month(mkeyOf(date));const arr=m.tasks[date]||[];const i=arr.findIndex(x=>x.id===id);if(i>=0){done=arr[i].done;arr.splice(i,1);if(!arr.length)delete m.tasks[date]}save(mkeyOf(date))}
  const m2=month(mkeyOf(nd));(m2.tasks[nd]||(m2.tasks[nd]=[])).push({id:id||uid(),...body,done});
  save(mkeyOf(nd));watch(mkeyOf(nd));closeSheet();render();
}
function saveRoutine(){
  const title=val("f-title");if(!title){toast("Hãy nhập tên việc");return}
  const days=[...document.querySelectorAll("#days .chip.on")].map(x=>Number(x.dataset.day));
  if(!days.length){toast("Chọn ít nhất một ngày");return}
  const body={title,days,time:val("f-time"),goal:val("f-goal")||null,icon:pickedIcon()};
  const rs=S.main.routines||(S.main.routines=[]);
  if(sheetCtx.id){Object.assign(rs.find(x=>x.id===sheetCtx.id),body)}else rs.push({id:uid(),from:todayKey(),...body});
  save("main");closeSheet();render();
}
function saveGoal(markDone){
  const title=val("f-title");if(!title){toast("Hãy nhập tên mục tiêu");return}
  const{id,level}=sheetCtx;const parent=level==="short"?(val("f-parent")||sheetCtx.parent):null;
  const pr=$("#f-prog");
  const body={title,period:val("f-period"),icon:pickedIcon(),parent,level};
  if(pr)body.progress=Number(pr.value);
  const gs=S.main.goals||(S.main.goals=[]);
  let g;
  if(id){g=gs.find(x=>x.id===id);Object.assign(g,body)}else{g={id:uid(),progress:0,...body};gs.push(g)}
  if(markDone){g.done=true;g.doneAt=todayKey();g.progress=100}
  save("main");closeSheet();render();
  if(markDone)toast("Chúc mừng! Mục tiêu đã vào Thành tựu ★");
}
function moveGoal(d){
  const g=goalById(sheetCtx.id);const gs=S.main.goals;
  const sib=gs.filter(x=>x.level===g.level&&x.parent===g.parent&&!x.done);
  const i=sib.indexOf(g),j=i+d;if(j<0||j>=sib.length)return;
  const a=gs.indexOf(g),b=gs.indexOf(sib[j]);[gs[a],gs[b]]=[gs[b],gs[a]];
  save("main");render();toast(d<0?"Đã chuyển lên":"Đã chuyển xuống");
}
function doDelete(){
  const c=sheetCtx;
  if(c.type==="task"){const m=month(mkeyOf(c.date));m.tasks[c.date]=(m.tasks[c.date]||[]).filter(x=>x.id!==c.id);if(!m.tasks[c.date].length)delete m.tasks[c.date];save(mkeyOf(c.date))}
  if(c.type==="routine"){S.main.routines=routines().filter(x=>x.id!==c.id);save("main")}
  if(c.type==="goal"){
    const kill=new Set([c.id,...goals().filter(x=>x.parent===c.id).map(x=>x.id)]);
    S.main.goals=goals().filter(x=>!kill.has(x.id));
    S.main.routines=routines().filter(r=>!kill.has(r.goal));
    save("main");
  }
  closeSheet();render();toast("Đã xoá");
}

function readURL(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function shrink(file){
  const url=await readURL(file);if(!url)return null;
  return new Promise(res=>{const img=new Image();img.onload=()=>{
    let max=900,q=.82,out=null;
    for(let i=0;i<6;i++){const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<200000)break;max=Math.round(max*.8);q=Math.max(.5,q-.08)}
    res(out)};img.onerror=()=>res(null);img.src=url});
}
async function addPhotos(files){
  if(!files.length)return;
  toast("Đang thêm ảnh…");
  const ps=S.main.photos||(S.main.photos=[]);let last=null,bad=0;
  for(const f of files){
    try{
      const isGif=/gif/i.test(f.type)||/\.gif$/i.test(f.name||"");
      const src=isGif&&f.size<=8000000?await readURL(f):await shrink(f);
      if(!src){bad++;continue}
      const id=uid();
      await idbPut(id,src);photoCache[id]=src;ps.push({id});
      last=id;
    }catch(e){bad++}
  }
  if(bad)toast(bad===1?"Có 1 ảnh chưa thêm được. Thử chọn lại ảnh khác nhé.":`Có ${bad} ảnh chưa thêm được.`);
  else if(last)toast("Đã thêm ảnh ♡");
  if(last){S.main.photo={date:todayKey(),id:last};S.main.pinned=last}
  save("main");sheetPhotos();render();
}
async function doExport(){
  toast("Đang chuẩn bị bản sao lưu…");
  const photos={};for(const p of S.main.photos||[]){try{const v=p.src||await idbGet(p.id);if(v)photos[p.id]=v}catch{}}
  const data=JSON.stringify({app:"so-tay-muc-tieu",at:new Date().toISOString(),main:S.main,months:S.months,photos});
  const filename=`so-tay-muc-tieu-${todayKey()}.json`;
  const file=new File([data],filename,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sao lưu Sổ Tay Mục Tiêu"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();a.remove();
  toast("Đã tải bản sao lưu");
}
function doImport(file){
  if(!file)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.main||!d.main.goals)throw 0;
    for(const[id,v]of Object.entries(d.photos||{})){await idbPut(id,v);photoCache[id]=v}
    S.main=d.main;S.months=d.months||{};save();render();toast("Đã khôi phục dữ liệu")}catch{toast("Tệp này không phải bản sao lưu của Sổ Tay Mục Tiêu")}};
  r.readAsText(file);
}

/* day rollover while app stays open */
let lastDay=todayKey();
setInterval(()=>{const k=todayKey();if(k!==lastDay){lastDay=k;watch(mkeyOf(k));if(ui.calSel<k)ui.calSel=k;render()}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&todayKey()!==lastDay){lastDay=todayKey();render()}});

render();boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
